const db=firebase.firestore(), log=m=>{document.getElementById('log').textContent+='\n'+m;};
document.getElementById('signin').onclick=()=>{
  firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(r=>{
    log('Signed in as '+r.user.email);
    document.getElementById('run').disabled=false;
  }).catch(e=>log('Sign-in failed: '+e.message));
};
document.getElementById('run').onclick=async()=>{
  document.getElementById('run').disabled=true;
  try{
    let batch=db.batch(), n=0, total=0;
    const flush=async()=>{ if(n){await batch.commit(); total+=n; log('  …committed '+total+' docs'); batch=db.batch(); n=0;} };
    for(const [id,v] of Object.entries(VETS)){ batch.set(db.collection('vets').doc(id),v); if(++n>=400) await flush(); }
    await flush();
    log('Vets done.');
    for(const [id,o] of Object.entries(ORGS)){ batch.set(db.collection('rescueOrgs').doc(id),o); if(++n>=400) await flush(); }
    await flush();
    log('DONE \u2713  Now restore the locked security rules.');
  }catch(e){ log('ERROR: '+e.message+'\nDid you publish the temporary import rules first?'); document.getElementById('run').disabled=false; }
};
