.tag.Vet{background:#E4F1F5;color:#0F7291}.tag.Rescue{background:#E8F3EE;color:#337A62}
</style></head><body><div class="wrap">

const KEY='bc-wa-audit';
let st={}; try{ st=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} }
function render(){
  const list=document.getElementById('list'); list.innerHTML='';
  let city='';
  DATA.forEach(d=>{
    const c=d.kind+' — '+d.city;
    if(c!==city){ city=c; const h=document.createElement('div'); h.className='city'; h.textContent=c; list.appendChild(h); }
    const v=st[d.id];
    const el=document.createElement('div');
    el.className='card'+(v==='yes'?' yes':v==='no'?' no':'');
    el.innerHTML=`<div class="nm">${d.name}<span class="tag ${d.kind}">${d.kind}</span></div>
      <div class="ph">${d.phone}</div>
      <div class="row">
        <a class="b open" href="https://wa.me/${d.wa}" target="_blank" rel="noopener">Open WA</a>
        <button class="b yes${v==='yes'?' on':''}" data-id="${d.id}" data-v="yes">Has WA</button>
        <button class="b no${v==='no'?' on':''}" data-id="${d.id}" data-v="no">No WA</button>
      </div>`;
    list.appendChild(el);
  });
  const done=Object.keys(st).length;
  document.getElementById('cnt').textContent=done+' of '+DATA.length+' checked';
  document.getElementById('fill').style.width=(100*done/DATA.length)+'%';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-id]'); if(!b) return;
  const id=b.dataset.id;
  st[id]=(st[id]===b.dataset.v)?undefined:b.dataset.v;
  if(st[id]===undefined) delete st[id];
  save(); render();
});
document.getElementById('copy').addEventListener('click',()=>{
  const lines=DATA.filter(d=>st[d.id]).map(d=>d.id+','+st[d.id]+','+d.name);
  const txt='BAJA CONNECT WHATSAPP AUDIT\n'+lines.join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(
    ()=>alert('Copied '+lines.length+' results — paste them to Claude.'),
    ()=>prompt('Copy this:',txt));
});
render();
